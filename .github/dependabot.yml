# CAVU runs Dependabot at the same day and time as AIM and ContextMatrix, so
# bumps to the dependencies they share land the same night.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/internal/sandbox"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "Europe/Oslo"
    commit-message:
      prefix: "build"
      include: "scope"
