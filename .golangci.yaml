version: "2"
run:
  build-tags:
  - integration
  - conformance
linters:
  default: none
  enable:
  - errcheck
  - govet
  - ineffassign
  - staticcheck
  - unused
  - containedctx
  - depguard
  - gocritic
  - godot
  - gosec
  - misspell
  - modernize
  - nakedret
  - nlreturn
  - noctx
  - revive
  - testifylint
  - unconvert
  - unparam
  - whitespace
  - wsl_v5
  settings:
    depguard:
      rules:
        server-half:
          files:
          - "**/internal/engine/**"
          - "**/internal/store/**"
          - "**/internal/replay/**"
          deny:
          - pkg: github.com/mhersson/cavu/internal/sandbox
            desc: the server half must run where no container runtime exists
          - pkg: github.com/mhersson/cavu/internal/runner
            desc: the server half must run where no container runtime exists
          - pkg: github.com/mhersson/cavu/internal/proxy
            desc: the server half must run where no container runtime exists
          - pkg: github.com/mhersson/cavu/internal/sidecar
            desc: the server half must run where no container runtime exists
          - pkg: github.com/mhersson/cavu/internal/git$
            desc: the server half must run where no container runtime exists
          - pkg: github.com/mhersson/cavu/internal/git/
            desc: the server half must run where no container runtime exists
          - pkg: github.com/mhersson/cavu/internal/driver
            desc: the server half must run where no container runtime exists
    nakedret:
      max-func-lines: 5
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    presets:
    - common-false-positives
    - std-error-handling
    - comments
    rules:
    # Tests: int conversions (G115), explicit-argv tools (G204), fixture files
    # and dirs under t.TempDir() with fixed modes (G301, G302, G306) and seeded
    # RNGs (G404).
    - linters: [gosec]
      text: "G115|G204|G301|G302|G306|G404"
      path: "_test\\.go$"
    # noctx in tests: helpers may call exec.Command, net.Listen and net.Dial
    # without a context; they end with the test.
    - linters: [noctx]
      path: "_test\\.go$"
    # unused parameters in test fakes that must match a callback signature.
    - linters: [revive]
      text: "unused-parameter"
      path: "_test\\.go$"
    # unparam in tests: helpers and callbacks with fixed arguments, always-nil errors or unused results.
    - linters: [unparam]
      path: "_test\\.go$"
issues:
  max-issues-per-linter: 50
  max-same-issues: 8
  fix: false
formatters:
  enable:
  - gofumpt
  - goimports
